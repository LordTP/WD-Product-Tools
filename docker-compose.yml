services:
  app:
    build: .
    # Not published to the host — Caddy reaches it over the internal network.
    expose:
      - "3000"
    # Secrets come from a .env file next to this compose file (gitignored).
    # Put APP_PASSWORD + SHIPHERO_* in it. See .env.example for the keys.
    env_file:
      - .env
    environment:
      # Override the DB path to the mounted volume (survives redeploys).
      - DATABASE_PATH=/data/data.db
    volumes:
      - po-data:/data # SQLite persists across redeploys
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certs persist across restarts
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  po-data:
  caddy-data:
  caddy-config:
